<!DOCTYPE html>
<html>
<head>
    <title>Vector Gates Combined</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .form-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
        }
        select, button {
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result-card {
            padding: 20px;
            border-radius: 12px;
            margin: 10px 0;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .pass { background: #28a745; }
        .fail { background: #dc3545; }
        .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mixed-Bit Gates Simulation</h1>

        <!-- Dropdown form -->
        <div class="form-box">
            <form id="bitForm" method="POST" action="/run_combined">
                <label for="num_bits">Select Number of Bits:</label>
                <select name="num_bits" id="num_bits">
                    {% for i in range(1, 17) %}
                        <option value="{{ i }}">{{ i }}</option>
                    {% endfor %}
                </select>
                <button type="submit">Run Simulation</button>
            </form>
        </div>

        <!-- Results -->
        <div id="results"></div>
    </div>

    <script>
        document.getElementById("bitForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const response = await fetch("/run_combined", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            let resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";

            // Validation result card
            if (data.validation) {
                let valBox = document.createElement("div");
                valBox.className = "result-card " + (data.validation.status === "PASS" ? "pass" : "fail");
                valBox.innerHTML = `<span>Validation: ${data.validation.status}</span>
                                    <span class="icon">${data.validation.status === "PASS" ? "✔️" : "❌"}</span>`;
                resultsDiv.appendChild(valBox);
            }

            // Simulation result card
            if (data.simulation) {
                let simBox = document.createElement("div");
                simBox.className = "result-card " + (data.simulation.status === 0 ? "pass" : "fail");
                simBox.innerHTML = `<span>Simulation: ${data.simulation.status === 0 ? "PASS" : "FAIL"}</span>
                                    <span class="icon">${data.simulation.status === 0 ? "✔️" : "❌"}</span>`;
                resultsDiv.appendChild(simBox);
            }
        });
    </script>
</body>
</html>
