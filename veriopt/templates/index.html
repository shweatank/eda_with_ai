<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VeriOpt Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #2980b9;
    }
    .actions {
      text-align: center;
      margin-top: 20px;
    }
    #log {
      background: #1e1e1e;
      color: #0f0;
      font-family: monospace;
      padding: 15px;
      border-radius: 6px;
      height: 300px;
      overflow-y: auto;
    }
    pre {
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>⚡ VeriOpt Dashboard ⚡</h1>

  <!-- Generate RTL -->
  <div class="card">
    <h2>Generate RTL</h2>
    <form id="rtlForm">
      <label>Design Type</label>
      <input type="text" name="design_type" placeholder="e.g. comparator" required>
      <button type="submit">Generate RTL</button>
    </form>
  </div>

  <!-- Generate Testbench -->
  <div class="card">
    <h2>Generate Testbench</h2>
    <form id="tbForm">
      <label>Design Type</label>
      <input type="text" name="design_type" placeholder="e.g. comparator" required>
      <label>Testbench Type</label>
      <select name="tb_type">
        <option value="python">Cocotb (Python)</option>
        <option value="uvm">UVM (SystemVerilog)</option>
      </select>
      <button type="submit">Generate Testbench</button>
    </form>
  </div>

  <!-- Flow buttons -->
  <div class="card actions">
    <h2>EDA Flow</h2>
    <button onclick="trigger('/simulate')">▶ Simulate</button>
    <button onclick="trigger('/synthesize')">⚙ Synthesize</button>
    <button onclick="trigger('/profile')">📊 Profile</button>
    <button onclick="trigger('/gds')">🏗 Generate GDSII</button>
    <button onclick="trigger('/analyze_gds')">🧠 AI Analysis</button>
  </div>

  <!-- Log output -->
  <div class="card">
    <h2>Console Log</h2>
    <div id="log"></div>
  </div>

  <script>
    async function postForm(formId, url) {
      const form = document.getElementById(formId);
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const response = await fetch(url, { method: "POST", body: formData });
        const result = await response.json();
        document.getElementById("log").innerHTML += "<pre>" + JSON.stringify(result, null, 2) + "</pre>";
      });
    }

    async function trigger(url) {
      const response = await fetch(url, { method: "POST" });
      const result = await response.json();
      document.getElementById("log").innerHTML += "<pre>" + JSON.stringify(result, null, 2) + "</pre>";
    }

    // Wire forms to correct routes
    postForm("rtlForm", "/generate_design");
    postForm("tbForm", "/generate_testbench");
  </script>
</body>
</html>
